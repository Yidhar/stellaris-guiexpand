; stellaris-guiexpand: settings. Saved in place; the game has to be restarted to apply a change.

[guiexpand]
; The player's colour theme at the start: 0 aurora, 1 ember, 2 verdant, 3 crimson. Components (stellaris-argon-ui ...) read it from the host and a settings page can
; change it while the game runs.
theme=0

; More folders to scan for declared panels (a mod's interface\stl_gui\*.txt), separated by ';'. For developing a mod without enabling it in a
; playset; the mods of the active playset are always scanned.
extra_mod_dirs=

; Development only, off for players:
; logs\stellaris_guiexpand.cmd: lines such as "panel list" or "dump" that the host runs (used by the test scripts)
dev_commands=0
; unload the DLL with the named event Local\stellaris_guiexpand_unload_<pid>, so that a new build can be tried without restarting the game. The launcher never
; unloads plugins and a released plugin must not unload itself: leave it off.
dev_unload=0

; guidll: settings. Saved in place; the game has to be restarted to apply a change.

[guidll]
; The Command Deck, the reference skin: a status capsule at the bottom of the screen, and a deck of five pages
; (overview, economy, time, script effects, settings) that the capsule's orb or Ctrl+Shift+G opens. 0 = host only: plugins' and mods' panels are
; still drawn.
deck=1
; open the deck window at start (the capsule is always there)
deck_open=0
; colour theme of the skin: 0 aurora, 1 ember, 2 verdant, 3 crimson
theme=0
; stars and shooting stars in the deck's background
stars=1

; More folders to scan for declared panels (a mod's interface\stl_gui\*.txt), separated by ';'. For developing a mod without enabling it in a
; playset; the mods of the active playset are always scanned.
extra_mod_dirs=

; Development only, off for players:
; logs\guidll.cmd: lines such as "tab 3" or "dump" that the host runs (used by the test scripts)
dev_commands=0
; unload the DLL with the named event Local\guidll_unload_<pid>, so that a new build can be tried without restarting the game. The launcher never
; unloads plugins and a released plugin must not unload itself: leave it off.
dev_unload=0
